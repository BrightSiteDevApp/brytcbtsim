<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Offline | BRYT CBT SIM</title>
    
    <link rel="icon" type="image/png" sizes="192x192" href="/static/img/brytcbtsim-logo1.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* 🚀 STRICT BRAND SYSTEM & BOX SIZING */
        :root {
            --primary-blue: #1D5ED0;
            --accent-blue: #159FE3;
            --deep-navy: #071A3A;
            --near-black: #0B1220;
            --pure-white: #FFFFFF;
            --light-bg: #F5F8FC;
            --text-gray: #64748B;
            --border-color: #E2E8F0;
        }

        html, body { max-width: 100vw !important; overflow-x: hidden !important; margin: 0; padding: 0; }
        *, *::before, *::after { box-sizing: border-box !important; }

        body {
            background-color: var(--light-bg);
            color: var(--near-black);
            font-family: 'Sora', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 1.5rem;
            box-sizing: border-box;
            background-image: radial-gradient(var(--border-color) 1px, transparent 1px);
            background-size: 30px 30px;
            -webkit-font-smoothing: antialiased;
        }

        .offline-card {
            background: var(--pure-white);
            border-radius: 24px;
            padding: 3.5rem 2.5rem;
            max-width: 460px;
            width: 100%;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 40px rgba(7, 26, 58, 0.05);
            animation: fadeSlideUp 0.5s ease forwards;
        }

        .offline-card img {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 15px rgba(29, 94, 208, 0.15);
        }

        h1 { 
            font-size: 1.8rem; 
            margin: 0 0 10px 0; 
            color: var(--deep-navy); 
            font-weight: 800; 
            letter-spacing: -0.5px;
        }

        p { 
            color: var(--text-gray); 
            font-size: 1rem; 
            line-height: 1.6; 
            margin: 0 0 2.5rem 0; 
            font-weight: 500; 
        }

        .btn-retry {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--primary-blue);
            color: var(--pure-white);
            border: none;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Sora', sans-serif;
            font-size: 1rem;
            width: 100%;
            box-shadow: 0 4px 15px rgba(29, 94, 208, 0.2);
            transition: all 0.2s ease;
        }

        .btn-retry svg { width: 18px; height: 18px; }

        .btn-retry:hover {
            background: var(--deep-navy);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(7, 26, 58, 0.3);
        }

        @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* 🚀 STRICT MOBILE FIXES (Zooming solved) */
        @media (max-width: 1024px) {
            html, body { font-size: 13px !important; }
            .offline-card { padding: 2.5rem 1.5rem; border-radius: 20px; }
            .offline-card img { width: 48px; height: 48px; margin-bottom: 1.25rem;}
            h1 { font-size: 1.6rem; }
            p { font-size: 0.95rem; margin-bottom: 2rem;}
            .btn-retry { padding: 0.9rem 1rem; font-size: 0.95rem; border-radius: 10px;}
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <img src="/static/img/brytcbtsim-logo.png" alt="BRYT Logo">
        <h1>You are Offline</h1>
        <p>It looks like your internet connection dropped. Reconnect to access live exams, telemetry, and practice banks.</p>
        <button onclick="window.location.reload()" class="btn-retry">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            Check Connection & Retry
        </button>
    </div>
</body>
</html>
