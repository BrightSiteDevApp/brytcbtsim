<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Question Bank Manager | BRYT CBT SIM</title>
    
    <link rel="icon" type="image/svg+xml" href="../static/img/brytcbtsim-logo.svg">
    <link rel="icon" type="image/png" sizes="512x512" href="../static/img/brytcbtsim-logo.png">
    <link rel="icon" type="image/png" sizes="192x192" href="../static/img/brytcbtsim-logo1.png">
    <link rel="apple-touch-icon" href="../static/img/apple-touch-icon.png">
    <link rel="icon" href="../favicon.ico" type="image/x-icon">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/main.css">

        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']], processEscapes: true },

        };

    <!-- PWA Manifest & Mobile Capability -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#071A3A">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BRYT CBT">

    <style>
        /* 🚀 STRICT BRAND SYSTEM & BOX SIZING */
        :root {
            --primary-blue: #1D5ED0;
            --accent-blue: #159FE3;
            --deep-navy: #071A3A;
            --near-black: #0B1220;
            --pure-white: #FFFFFF;
            --light-bg: #F5F8FC;
            --text-gray: #64748B;
            --border-color: #E2E8F0;
            --gradient-primary: linear-gradient(135deg, #071A3A 0%, #1D5ED0 100%);
        }

        html, body { max-width: 100vw !important; overflow-x: hidden !important; margin: 0; padding: 0; }
        *, *::before, *::after { box-sizing: border-box !important; }

        body { 
            background-color: var(--light-bg); color: var(--near-black); 
            font-family: 'Sora', sans-serif; margin: 0; padding: 0; 
            width: 100%; min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        
        /* 🚀 PREMIUM ADMIN NAV */
        .admin-nav {
            height: 70px; background: var(--gradient-primary); color: var(--pure-white); 
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 5%; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 15px rgba(7, 26, 58, 0.15); width: 100%;
        }
        
        .admin-nav-title { font-weight: 800; font-size: 1.15rem; display: flex; align-items: center; gap: 12px; letter-spacing: -0.5px;}
        .admin-nav-title img { width: 36px; height: 36px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); background: white; padding: 2px;}
        
        .btn-back-nav {
            background: rgba(255,255,255,0.1); color: var(--pure-white); border: 1px solid rgba(255,255,255,0.2); 
            padding: 0.6rem 1.2rem; border-radius: 10px; font-weight: 700; font-family: 'Sora', sans-serif; 
            cursor: pointer; transition: all 0.2s; font-size: 0.9rem; backdrop-filter: blur(10px);
        }
        .btn-back-nav:hover { background: var(--pure-white); color: var(--near-black); }

        /* 🚀 GLOBAL STATS BAR */
        .global-stats-bar {
            display: flex; gap: 16px; overflow-x: auto; padding: 1.5rem 5%; background: var(--pure-white); 
            border-bottom: 1px solid var(--border-color); width: 100%;
            -ms-overflow-style: none; scrollbar-width: none; box-shadow: 0 4px 15px rgba(7, 26, 58, 0.02);
        }
        .global-stats-bar::-webkit-scrollbar { display: none; }
        
        .stat-box {
            background: var(--light-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: 16px 24px; 
            text-align: left; min-width: 160px; box-shadow: 0 2px 5px rgba(7, 26, 58, 0.02); flex-shrink: 0;
            display: flex; flex-direction: column; gap: 4px; transition: transform 0.2s;
        }
        .stat-box:hover { transform: translateY(-2px); border-color: #CBD5E1; }
        .stat-box span { font-size: 0.75rem; font-weight: 700; color: var(--text-gray); text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-box strong { font-size: 1.8rem; font-weight: 800; color: var(--deep-navy); line-height: 1;}

        /* 🚀 TABS */
        .tab-wrapper { padding: 2rem 5% 0 5%; display: flex; gap: 12px; flex-wrap: wrap; width: 100%; max-width: 1400px; margin: 0 auto;}
        .tab-btn {
            padding: 1rem 2rem; border-radius: 12px; font-weight: 700; border: none; cursor: pointer; 
            background: var(--pure-white); color: var(--text-gray); transition: all 0.2s; flex-grow: 1; text-align: center; font-size: 0.95rem;
            border: 1px solid var(--border-color); box-shadow: 0 4px 10px rgba(7, 26, 58, 0.02); font-family: 'Sora', sans-serif;
        }
        .tab-btn:hover { background: var(--light-bg); color: var(--near-black); }
        .tab-btn.active { background: var(--primary-blue); color: var(--pure-white); border-color: var(--primary-blue); box-shadow: 0 6px 15px rgba(29, 94, 208, 0.2); }

        /* 🚀 LAYOUT CONTAINERS */
        .staging-layout { display: grid; grid-template-columns: 350px 1fr; max-width: 1400px; margin: 1.5rem auto 3rem auto; gap: 24px; padding: 0 5%; width: 100%; align-items: start; }
        .editor-layout { max-width: 900px; margin: 1.5rem auto 3rem auto; padding: 0 5%; width: 100%; display: none; }
        
        .panel-card { background: var(--pure-white); padding: 2.5rem; border-radius: 20px; border: 1px solid var(--border-color); box-shadow: 0 10px 30px rgba(7, 26, 58, 0.03); width: 100%; overflow: hidden; }
        
        .panel-card h3 { margin: 0 0 8px 0; color: var(--near-black); font-size: 1.25rem; font-weight: 800; letter-spacing: -0.5px;}
        .panel-card p { color: var(--text-gray); font-size: 0.9rem; margin: 0 0 1.5rem 0; font-weight: 500;}

        /* 🚀 INPUTS & BUTTONS */
        .input-group { margin-bottom: 1.5rem; }
        .input-group label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--text-gray); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;}
        
        .input-group input, .input-group select { 
            width: 100%; padding: 1rem 1.2rem; border-radius: 12px; border: 1px solid var(--border-color); 
            font-family: 'Sora', sans-serif; font-size: 0.95rem; box-sizing: border-box; outline: none; transition: all 0.2s; 
            color: var(--near-black); background: var(--light-bg); font-weight: 600;
        }
        .input-group input:focus, .input-group select:focus { border-color: var(--primary-blue); background: var(--pure-white); box-shadow: 0 0 0 4px rgba(29, 94, 208, 0.1);}
        
        .input-group select {
            appearance: none; -webkit-appearance: none; -moz-appearance: none; cursor: pointer;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748B' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat; background-position: right 1.2rem center; background-size: 1em;
        }

        .search-flex { display: flex; gap: 12px; width: 100%; align-items: stretch; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .search-flex input { margin-bottom: 0; flex-grow: 1; min-width: 0; padding: 1rem 1.2rem; border-radius: 12px; border: 1px solid var(--border-color); font-family: 'Sora', sans-serif; font-size: 0.95rem; background: var(--light-bg); color: var(--near-black); font-weight: 600; transition: all 0.2s; outline: none;}
        .search-flex input:focus { border-color: var(--primary-blue); background: var(--pure-white); box-shadow: 0 0 0 4px rgba(29, 94, 208, 0.1); }
        .search-flex button { flex-shrink: 0; margin-bottom: 0; white-space: nowrap; }

        .btn { 
            width: 100%; padding: 1rem 1.5rem; border-radius: 12px; font-weight: 700; border: none; cursor: pointer; 
            font-size: 0.95rem; transition: all 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; font-family: 'Sora', sans-serif;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn-blue { background: var(--primary-blue); color: white; box-shadow: 0 4px 12px rgba(29, 94, 208, 0.2);}
        .btn-blue:hover { background: var(--deep-navy); box-shadow: 0 6px 15px rgba(7, 26, 58, 0.3);}
        .btn-green { background: #10B981; color: white; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);}
        .btn-green:hover { background: #059669; box-shadow: 0 6px 15px rgba(5, 150, 105, 0.3);}
        .btn-red { background: #FEF2F2; color: #DC2626; border: 1px solid #FECACA; }
        .btn-red:hover { background: #FEE2E2; border-color: #EF4444;}
        .btn-orange { background: #EA580C; color: white; box-shadow: 0 4px 12px rgba(234, 88, 12, 0.2);}
        .btn-orange:hover { background: #C2410C; box-shadow: 0 6px 15px rgba(194, 65, 12, 0.3);}
        
        /* 🚀 QUESTION PREVIEW CARD */
        .question-card { border: 1px solid var(--border-color); border-radius: 20px; padding: 2rem; background: var(--pure-white); width: 100%; overflow-x: auto; box-shadow: 0 4px 15px rgba(7, 26, 58, 0.02);}
        
        .q-meta { 
            display: flex; justify-content: space-between; align-items: center; font-weight: 800; color: var(--text-gray); 
            border-bottom: 2px solid var(--border-color); padding-bottom: 1rem; margin-bottom: 1.5rem; text-transform: uppercase; 
            flex-wrap: wrap; gap: 10px; font-size: 0.8rem; letter-spacing: 0.5px;
        }
        .q-meta span:first-child { color: var(--primary-blue); }

        .q-text { font-size: 1.15rem; font-weight: 500; margin-bottom: 2rem; line-height: 1.7; word-wrap: break-word; overflow-wrap: break-word; color: var(--near-black);}
        
        .option-box { display: flex; align-items: center; padding: 1rem 1.25rem; background: var(--light-bg); border: 1px solid var(--border-color); border-radius: 12px; margin-bottom: 12px; word-wrap: break-word; transition: all 0.2s;}
        
        .option-box.correct-ans { background: #ECFDF5; border-color: #10B981; }
        .opt-letter { width: 32px; height: 32px; border-radius: 8px; background: var(--pure-white); border: 1px solid var(--border-color); display: flex; justify-content: center; align-items: center; font-weight: 800; margin-right: 15px; color: var(--text-gray); flex-shrink: 0; font-size: 0.9rem;}
        
        .option-box.correct-ans .opt-letter { background: #10B981; color: white; border-color: #10B981; box-shadow: 0 2px 8px rgba(16, 185, 129, 0.2);}
        .option-box.correct-ans .opt-text { color: #065F46; font-weight: 600;}

        .opt-text { font-size: 0.95rem; color: var(--near-black); font-weight: 500;}

        .instruction-box { background: var(--light-bg); padding: 1.25rem 1.5rem; border-radius: 12px; border-left: 4px solid var(--primary-blue); margin-bottom: 1.5rem; color: var(--near-black); border-top: 1px solid var(--border-color); border-right: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color);}

        /* 🚀 STRICT MOBILE FIXES (Zooming solved) */
        @media (max-width: 1024px) {
            html, body { font-size: 13px !important; }
            
            .admin-nav { flex-direction: column; height: auto; padding: 1rem 1.5rem; gap: 12px; text-align: center; }
            .btn-back-nav { width: 100%; justify-content: center; }
            
            .global-stats-bar { padding: 1.5rem 1rem; gap: 12px; }
            .stat-box { padding: 12px 16px; min-width: 130px; border-radius: 12px;}
            .stat-box strong { font-size: 1.5rem; }
            
            .tab-wrapper { padding: 1.5rem 1rem 0 1rem; gap: 10px; }
            .tab-btn { padding: 0.85rem 1rem; font-size: 0.85rem; border-radius: 10px;}
            
            .staging-layout { grid-template-columns: 1fr; padding: 0 1rem; gap: 1.25rem; margin-bottom: 2rem;}
            .editor-layout { padding: 0 1rem; margin-bottom: 2rem;}
            
            .panel-card { padding: 1.5rem 1.25rem; border-radius: 16px; }
            .panel-card h3 { font-size: 1.15rem; margin-bottom: 4px;}
            
            .modern-input, .input-group select, .search-flex input { padding: 0.85rem 1rem; font-size: 0.9rem; border-radius: 10px;}
            .btn { padding: 0.85rem; font-size: 0.9rem; border-radius: 10px;}
            
            .search-flex { flex-direction: column; gap: 10px;}
            .search-flex button { width: 100%; }
            
            #edit-actions, #staging-actions { display: flex !important; flex-direction: column; gap: 10px; margin-top: 1.5rem; }
            #edit-actions button, #staging-actions button { width: 100%; }
            
            .question-card { padding: 1.5rem 1.25rem; border-radius: 16px;}
            .q-meta { font-size: 0.75rem; flex-direction: column; align-items: flex-start; gap: 10px; padding-bottom: 0.8rem;}
            .q-text { font-size: 1.05rem; margin-bottom: 1.2rem;}
            .option-box { padding: 0.85rem 1rem; border-radius: 10px;}
            .opt-letter { width: 28px; height: 28px; font-size: 0.8rem; margin-right: 10px;}
            .opt-text { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <nav class="admin-nav">
        <div class="admin-nav-title">
            <img src="../static/img/brytcbtsim-logo.png" alt="BRYT CBT SIM Logo">
            BRYT Admin | Question Bank
        </div>
        <button onclick="window.location.href='../profile/index.html'" class="btn-back-nav">Back to Profile</button>
    </nav>

    <div class="global-stats-bar" id="stats-bar">
        <div class="stat-box"><span>Loading Stats</span><strong>...</strong></div>
    </div>

    <div class="tab-wrapper">
        <button class="tab-btn active" id="tab-btn-staging" onclick="switchTab('staging')">📥 ALOC Staging Area</button>
        <button class="tab-btn" id="tab-btn-editor" onclick="switchTab('editor')">✏️ Edit Main Bank</button>
    </div>

    <div class="staging-layout" id="section-staging">
        
        <!-- Left Panel: Fetch Controls -->
        <div class="panel-card">
            <h3>1. Pull from ALOC</h3>
            <p>Fetch 40 new questions to the holding queue.</p>
            
            <div class="input-group">
                <label>ALOC API Key</label>
                <input type="text" id="aloc-key" placeholder="Paste Token here..." class="modern-input">
            </div>
            
            <div class="input-group">
                <label>Select Subject</label>
                <select id="aloc-subject">
                    <option value="english">English Language</option>
                    <option value="mathematics">Mathematics</option>
                    <option value="physics">Physics</option>
                    <option value="chemistry">Chemistry</option>
                    <option value="biology">Biology</option>
                    <option value="economics">Economics</option>
                    <option value="commerce">Commerce</option>
                    <option value="government">Government</option>
                    <option value="literature">Literature in English</option>
                    <option value="currentaffairs">Current Affairs (GNS)</option>
                    <option value="civiceducation">Civic Education (GNS)</option>
                </select>
            </div>
            
            <button class="btn btn-blue" id="fetch-btn" onclick="fetchFromALOC()">Pull Questions</button>
            <div id="fetch-status" style="font-size: 0.85rem; text-align: center; font-weight: 700; margin-top: 15px;"></div>
        </div>

        <!-- Right Panel: Review & Approve -->
        <div class="panel-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 10px;">
                <h3 style="margin:0;">2. Review & Approve</h3>
                <div style="background: var(--light-bg); color: var(--primary-blue); padding: 6px 14px; border-radius: 10px; font-weight: 700; font-size: 0.85rem; border: 1px solid var(--border-color);">
                    <span id="staging-count">0</span> In Queue
                </div>
            </div>

            <div id="empty-state" style="text-align: center; color: var(--text-gray); padding: 4rem 0;">
                <svg style="width: 48px; opacity: 0.5; margin-bottom: 12px; color: var(--text-gray);" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>
                <p style="margin:0; font-weight: 500;">Holding queue is empty. Pull questions to begin.</p>
            </div>

            <div id="review-canvas" style="display: none;">
                <div class="question-card" id="q-card"></div>
                <div id="staging-actions" style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 1.5rem;">
                    <button class="btn btn-red" onclick="deleteStagingQuestion()" id="del-btn">
                        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width:18px;"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        Delete (Trash)
                    </button>
                    <button class="btn btn-green" onclick="approveAndMove()" id="app-btn">
                        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width:18px;"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
                        Approve & Move to Main
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="editor-layout" id="section-editor">
        <div class="panel-card">
            <h3>Search & Edit Main Question Bank</h3>
            <p>Enter the 4-character ID (e.g. X8B2) to find and modify a live question.</p>
            
            <div class="search-flex">
                <input type="text" id="search-id" placeholder="Enter Short ID..." maxlength="5" style="text-transform: uppercase;">
                <button class="btn btn-blue" onclick="searchMainDatabase()" id="search-btn" style="width: auto;">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width:18px;"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    Search Bank
                </button>
            </div>
            
            <div id="search-status" style="font-size: 0.9rem; font-weight: 600; margin-bottom: 1.5rem; text-align: center;"></div>

            <div id="editor-canvas" style="display: none; border-top: 2px solid var(--border-color); padding-top: 2rem;">
                <div class="question-card" id="editor-q-card" style="margin-bottom: 1.5rem;"></div>
                
                <div class="input-group">
                    <label>Change Correct Answer To:</label>
                    <select id="edit-correct-option">
                        <option value="A">Option A</option>
                        <option value="B">Option B</option>
                        <option value="C">Option C</option>
                        <option value="D">Option D</option>
                    </select>
                </div>

                <div id="edit-actions" style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <button class="btn btn-red" onclick="deleteMainQuestion()" id="edit-del-btn">
                        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width:18px;"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        Delete Permanently
                    </button>
                    <button class="btn btn-orange" onclick="updateMainAnswer()" id="edit-update-btn">
                        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width:18px;"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
                        Save New Answer
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 🚀 SCRIPTS (UNTOUCHED FUNCTIONALITY) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../static/app.js"></script>

            "âˆ’": "−", "â‰¡": "≡", "â‰ˆ": "≈", "âˆ¼": "∼", "âˆ": "∝", "âˆ«": "∫", "âˆ‘": "∑", "âˆЏ": "∏", "âˆ†": "Δ", "âˆ‡": "∇",
            "âˆˆ": "∈", "âˆ‰": "∉", "âˆ©": "∩", "âˆª": "∪", "âˆ´": "∴", "âˆµ": "∵", "âˆ—": "∗", "âˆ˜": "∘", "âŠ‚": "⊂", "âŠƒ": "⊃", "âŠ†": "⊆", "âŠ‡": "⊇",
            "âŠ•": "⊕", "âŠ—": "⊗", "âŠ¥": "⊥", "â‹…": "⋅", "Ã—": "×", "Ã·": "÷", "Â°": "°", "Â±": "±", "â‰ ": "≠", "â‰¤": "≤", "â‰¥": "≥", "âˆž": "∞", "âˆš": "√",
            "Â²": "^2", "Â³": "^3", "Â¹": "^1", "Â¼": "¼", "Â½": "½", "Â¾": "¾", "â†’": "→", "â‡Œ": "⇌", "â†": "←", "â†‘": "↑", "â†“": "↓", "â†”": "↔",
            "â‡’": "⇒", "â‡": "⇐", "â‡‘": "⇑", "â‡“": "⇓", "â‡”": "⇔", "Î±": "α", "Î²": "β", "Î³": "γ", "Î´": "δ", "Îµ": "ε", "Î¶": "ζ", 
            "Î·": "η", "Î¸": "θ", "Î¹": "ι", "Îº": "κ", "Î»": "λ", "Î¼": "μ", "Âµ": "μ", "Î½": "ν", "Î¾": "ξ", "Î¿": "ο", "Ï€": "π", "Ï": "ρ", "Ï‚": "ς", 
            "Ïƒ": "σ", "Ï„": "τ", "Ï…": "υ", "Ï†": "φ", "Ï‡": "χ", "Ïˆ": "ψ", "Ï‰": "ω", "Â": " " 
        };
        const MOJIBAKE_KEYS = Object.keys(MOJIBAKE_MAP).sort((a, b) => b.length - a.length);

        function prepText(txt) {
            if (!txt) return "";
            let c = txt.toString();
            for (let i = 0; i < MOJIBAKE_KEYS.length; i++) {
                c = c.split(MOJIBAKE_KEYS[i]).join(MOJIBAKE_MAP[MOJIBAKE_KEYS[i]]);
            }
            const mathCommands = ['\\frac', '\\theta', '\\pi', '\\sqrt', '\\alpha', '\\beta', '\\int', '\\sum', '\\sin', '\\cos', '\\tan', '^'];
            const hasMath = mathCommands.some(cmd => c.includes(cmd));
            const hasDelimiters = c.includes('$') || c.includes('\\(') || c.includes('\\[');
            if (hasMath && !hasDelimiters) c = '\\( ' + c + ' \\)';
            return c;
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) return window.location.href = '../login/index.html?mode=admin';
            
            const { data: profile } = await supabaseClient.from('profiles').select('role').eq('id', session.user.id).single();
            if (!profile || (profile.role !== 'admin' && profile.role !== 'jnr-admin')) {
                alert("SECURITY LOCKOUT: Admin & Jnr-Admin only.");
                window.location.href = '../dashboard/index.html';
                return;
            }

            if(localStorage.getItem('aloc_key')) document.getElementById('aloc-key').value = localStorage.getItem('aloc_key');

            loadGlobalStats();
            loadStagingQueue();
        });

        function switchTab(tab) {
            document.getElementById('tab-btn-staging').classList.remove('active');
            document.getElementById('tab-btn-editor').classList.remove('active');
            document.getElementById('section-staging').style.display = 'none';
            document.getElementById('section-editor').style.display = 'none';

            document.getElementById(`tab-btn-${tab}`).classList.add('active');
            document.getElementById(`section-${tab}`).style.display = tab === 'staging' ? 'grid' : 'block';
            
            if(window.innerWidth <= 900 && tab === 'staging') {
                document.getElementById('section-staging').style.display = 'block';
            }
        }

        async function loadGlobalStats() {
            // 🚀 Changed 'gns' to 'GNS' to match the database requirement
            const subjectsToCount = ['english', 'mathematics', 'physics', 'chemistry', 'biology', 'economics', 'commerce', 'government', 'literature', 'GNS'];
            try {
                const countPromises = subjectsToCount.map(async (subj) => {
                    const { count, error } = await supabaseClient.from('questions').select('*', { count: 'exact', head: true }).eq('subject', subj);
                    return { subject: subj, count: error ? 0 : (count || 0) };
                });

                const results = await Promise.all(countPromises);
                let html = '';
                results.forEach(res => {
                    if (res.count > 0) html += `<div class="stat-box"><span>${res.subject.toUpperCase()}</span><strong>${res.count}</strong></div>`;
                });

                document.getElementById('stats-bar').innerHTML = html || '<div class="stat-box"><span>Bank Empty</span><strong>0</strong></div>';
            } catch (err) {
                document.getElementById('stats-bar').innerHTML = '<div class="stat-box"><span>Error Loading</span><strong>!</strong></div>';
            }
        }

        async function fetchFromALOC() {
            const apiKey = document.getElementById('aloc-key').value.trim();
            const subject = document.getElementById('aloc-subject').value;
            const btn = document.getElementById('fetch-btn');
            const status = document.getElementById('fetch-status');
            
            if (!apiKey) { alert("Please enter your ALOC API Key."); return; }
            localStorage.setItem('aloc_key', apiKey); 

            btn.innerText = "Connecting..."; btn.disabled = true;
            status.style.color = "var(--primary-blue)"; status.innerText = "Scanning database for existing questions...";

            try {
                // 🚀 Changed dbSubject assignment to strictly use 'GNS' (uppercase)
                let dbSubject = subject;
                if (subject === 'mathematic') dbSubject = 'mathematics';
                if (subject === 'currentaffairs' || subject === 'civiceducation') dbSubject = 'GNS';

                let alocSlug = subject;
                if (subject === 'literature') alocSlug = 'englishlit';

                const [{data: mainQs}, {data: stageQs}] = await Promise.all([
                    supabaseClient.from('questions').select('question_text').eq('subject', dbSubject),
                    supabaseClient.from('staging_questions').select('question_text').eq('subject', dbSubject)
                ]);

                const allExisting = new Set([
                    ...(mainQs || []).map(q => q.question_text.trim().toLowerCase()),
                    ...(stageQs || []).map(q => q.question_text.trim().toLowerCase())
                ]);

                status.innerText = "Pulling from ALOC API...";

                let json = null, fetchSuccess = false;
                for(let attempt = 1; attempt <= 3; attempt++) {
                    try {
                        const response = await fetch(`https://questions.aloc.com.ng/api/v2/q/40?subject=${alocSlug}`, {
                            method: 'GET', headers: { 'Accept': 'application/json', 'AccessToken': apiKey }
                        });
                        json = await response.json();
                        if (json && json.status === 200 && json.data) { fetchSuccess = true; break; }
                    } catch(e) { console.warn(`Attempt ${attempt} failed.`); }
                }

                if (!fetchSuccess) throw new Error("ALOC API failed to respond after 3 attempts.");

                status.innerText = "Filtering duplicates & formatting...";

                const newQuestions = [];
                json.data.forEach(q => {
                    let finalQuestionText = q.question || "";
                    
                    if ((dbSubject === 'english' || dbSubject === 'literature') && q.section) {
                        finalQuestionText = `
                            <div class="instruction-box">
                                <strong style="color: var(--deep-navy); text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.5px;">Instruction / Passage</strong><br>
                                <em style="font-size: 1rem; color: var(--near-black);">${q.section}</em>
                            </div>
                            ${finalQuestionText}
                        `;
                    }

                    if (!finalQuestionText.trim()) {
                         finalQuestionText = `<em style="color: #DC2626;">[Data Error: ALOC provided no text body for this question. Delete this.]</em>`;
                    }

                    const qTextLower = finalQuestionText.trim().toLowerCase();
                    
                    if (!allExisting.has(qTextLower)) {
                        newQuestions.push({
                            subject: dbSubject, 
                            question_text: finalQuestionText,
                            option_a: q.option.a || "N/A",
                            option_b: q.option.b || "N/A",
                            option_c: q.option.c || "N/A",
                            option_d: q.option.d || "N/A",
                            correct_answer: (q.answer || "").toUpperCase(),
                            short_id: Math.random().toString(36).substr(2, 4).toUpperCase(),
                            year: q.examyear || "2026"
                        });
                        allExisting.add(qTextLower);
                    }
                });

                if (newQuestions.length === 0) throw new Error("ALOC returned duplicates of questions already in your bank! Try pulling again.");

                status.innerText = `Saving ${newQuestions.length} unique questions...`;
                const { error } = await supabaseClient.from('staging_questions').insert(newQuestions);
                if (error) throw error;

                status.style.color = "#10B981";
                status.innerText = `Success! Added ${newQuestions.length} new questions. (${json.data.length - newQuestions.length} duplicates skipped).`;
                setTimeout(() => loadStagingQueue(), 500);

            } catch (err) {
                console.error(err);
                status.style.color = "#DC2626"; status.innerText = "Error: " + err.message;
            } finally {
                btn.innerText = "Pull Questions"; btn.disabled = false;
            }
        }

        async function loadStagingQueue() {
            const { data, error } = await supabaseClient.from('staging_questions').select('*');
            if (error) return;
            stagingQueue = data || [];
            document.getElementById('staging-count').innerText = stagingQueue.length;

            if (stagingQueue.length === 0) {
                document.getElementById('empty-state').style.display = 'block';
                document.getElementById('review-canvas').style.display = 'none';
            } else {
                document.getElementById('empty-state').style.display = 'none';
                document.getElementById('review-canvas').style.display = 'block';
                currentIndex = 0;
                renderStagingCard();
            }
        }

        function renderStagingCard() {
            const q = stagingQueue[currentIndex];
            if (!q) return loadStagingQueue();
            const isCorrect = (opt) => q.correct_answer === opt ? 'correct-ans' : '';
            const html = `
                <div class="q-meta">
                    <span style="color: var(--primary-blue);">${q.subject.toUpperCase()} • Year: ${q.year}</span>
                    <span style="background: var(--light-bg); color: var(--text-gray); border: 1px solid var(--border-color); padding: 4px 10px; border-radius: 6px;">ID: ${q.short_id}</span>
                </div>
                <div class="q-text">${prepText(q.question_text)}</div>
                <div class="option-box ${isCorrect('A')}"><div class="opt-letter">A</div> <span class="opt-text">${prepText(q.option_a)}</span></div>
                <div class="option-box ${isCorrect('B')}"><div class="opt-letter">B</div> <span class="opt-text">${prepText(q.option_b)}</span></div>
                <div class="option-box ${isCorrect('C')}"><div class="opt-letter">C</div> <span class="opt-text">${prepText(q.option_c)}</span></div>
                <div class="option-box ${isCorrect('D')}"><div class="opt-letter">D</div> <span class="opt-text">${prepText(q.option_d)}</span></div>
            `;
            document.getElementById('q-card').innerHTML = html;
            if (window.MathJax) MathJax.typesetPromise();
        }

        async function approveAndMove() {
            const q = stagingQueue[currentIndex];
            const btn = document.getElementById('app-btn');
            btn.innerHTML = `<svg class="animate-spin" style="width: 18px;" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Checking...`; 
            btn.disabled = true;

            try {
                const { data: dupCheck } = await supabaseClient.from('questions').select('id').eq('question_text', q.question_text).maybeSingle();
                if (dupCheck) {
                    alert("⚠️ Duplicate Prevented! This exact question is already in the Main Bank. Deleting from staging...");
                    await supabaseClient.from('staging_questions').delete().eq('id', q.id);
                    stagingQueue.splice(currentIndex, 1);
                    return updateUI();
                }

                btn.innerHTML = `<svg class="animate-spin" style="width: 18px;" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Moving...`;
                const { error: insErr } = await supabaseClient.from('questions').insert([{
                    subject: q.subject, question_text: q.question_text,
                    option_a: q.option_a, option_b: q.option_b, option_c: q.option_c, option_d: q.option_d,
                    correct_answer: q.correct_answer, short_id: q.short_id, year: q.year
                }]);
                if (insErr) throw insErr;

                const { error: delErr } = await supabaseClient.from('staging_questions').delete().eq('id', q.id);
                if (delErr) throw delErr;

                stagingQueue.splice(currentIndex, 1);
                updateUI();
                loadGlobalStats(); 
            } catch (err) { alert("Move Error: " + err.message); } 
            finally { btn.innerHTML = `<svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width:18px;"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg> Approve & Move to Main`; btn.disabled = false; }
        }

        async function deleteStagingQuestion() {
            const q = stagingQueue[currentIndex];
            const btn = document.getElementById('del-btn');
            btn.innerHTML = `<svg class="animate-spin" style="width: 18px;" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Deleting...`; 
            btn.disabled = true;
            try {
                const { error } = await supabaseClient.from('staging_questions').delete().eq('id', q.id);
                if (error) throw error;
                stagingQueue.splice(currentIndex, 1);
                updateUI();
            } catch (err) { alert("Delete Error: " + err.message); } 
            finally { btn.innerHTML = `<svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width:18px;"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg> Delete (Trash)`; btn.disabled = false; }
        }

        function updateUI() {
            document.getElementById('staging-count').innerText = stagingQueue.length;
            if (stagingQueue.length === 0) {
                document.getElementById('empty-state').style.display = 'block';
                document.getElementById('review-canvas').style.display = 'none';
            } else {
                if (currentIndex >= stagingQueue.length) currentIndex = 0; 
                renderStagingCard();
            }
        }

        async function searchMainDatabase() {
            const shortId = document.getElementById('search-id').value.toUpperCase().trim();
            const btn = document.getElementById('search-btn');
            const status = document.getElementById('search-status');
            
            if (!shortId || shortId.length < 4) { status.style.color = "#DC2626"; status.innerText = "Enter a valid 4-char ID."; return; }

            btn.innerHTML = `<svg class="animate-spin" style="width: 18px;" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Searching...`; 
            btn.disabled = true; status.innerText = "";

            try {
                const { data, error } = await supabaseClient.from('questions').select('*').eq('short_id', shortId).maybeSingle();
                
                if (error) throw error;
                if (!data) {
                    status.style.color = "#DC2626"; status.innerText = `No question found with ID: ${shortId}`;
                    document.getElementById('editor-canvas').style.display = 'none';
                    return;
                }

                activeEditorQuestion = data;
                status.style.color = "#10B981"; status.innerText = "Question loaded successfully!";
                document.getElementById('editor-canvas').style.display = 'block';
                document.getElementById('edit-correct-option').value = data.correct_answer;
                
                renderEditorCard();

            } catch (err) {
                status.style.color = "#DC2626"; status.innerText = "Error: " + err.message;
            } finally {
                btn.innerHTML = `<svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width:18px;"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg> Search Bank`; 
                btn.disabled = false;
            }
        }

        function renderEditorCard() {
            const q = activeEditorQuestion;
            const isCorrect = (opt) => q.correct_answer === opt ? 'correct-ans' : '';
            const html = `
                <div class="q-meta">
                    <span style="color: var(--primary-blue);">${q.subject.toUpperCase()} • Year: ${q.year}</span>
                    <span style="background: var(--light-bg); color: var(--text-gray); border: 1px solid var(--border-color); padding: 4px 10px; border-radius: 6px;">ID: ${q.short_id}</span>
                </div>
                <div class="q-text">${prepText(q.question_text)}</div>
                <div class="option-box ${isCorrect('A')}"><div class="opt-letter">A</div> <span class="opt-text">${prepText(q.option_a)}</span></div>
                <div class="option-box ${isCorrect('B')}"><div class="opt-letter">B</div> <span class="opt-text">${prepText(q.option_b)}</span></div>
                <div class="option-box ${isCorrect('C')}"><div class="opt-letter">C</div> <span class="opt-text">${prepText(q.option_c)}</span></div>
                <div class="option-box ${isCorrect('D')}"><div class="opt-letter">D</div> <span class="opt-text">${prepText(q.option_d)}</span></div>
            `;
            document.getElementById('editor-q-card').innerHTML = html;
            if (window.MathJax) MathJax.typesetPromise();
        }

        async function updateMainAnswer() {
            if(!activeEditorQuestion) return;
            const newAns = document.getElementById('edit-correct-option').value;
            const btn = document.getElementById('edit-update-btn');
            
            btn.innerHTML = `<svg class="animate-spin" style="width: 18px;" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Saving...`; 
            btn.disabled = true;

            try {
                const { data, error } = await supabaseClient.from('questions')
                    .update({ correct_answer: newAns })
                    .eq('id', activeEditorQuestion.id)
                    .select();

                if (error) throw error;
                if (!data || data.length === 0) {
                    throw new Error("Update blocked by Database Security. Please run the SQL command provided to unlock UPDATE permissions.");
                }
                
                alert(`Success! Correct answer updated to Option ${newAns}`);
                activeEditorQuestion.correct_answer = newAns;
                renderEditorCard(); 
            } catch (err) { alert("Update Error: " + err.message); } 
            finally { btn.innerHTML = `<svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width:18px;"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg> Save New Answer`; btn.disabled = false; }
        }

        async function deleteMainQuestion() {
            if(!activeEditorQuestion) return;
            if(!confirm("⚠️ DANGER: Are you sure you want to permanently delete this question from the Main Bank? This cannot be undone.")) return;
            
            const btn = document.getElementById('edit-del-btn');
            btn.innerHTML = `<svg class="animate-spin" style="width: 18px;" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Deleting...`; 
            btn.disabled = true;

            try {
                const { data, error } = await supabaseClient.from('questions')
                    .delete()
                    .eq('id', activeEditorQuestion.id)
                    .select();

                if (error) throw error;
                if (!data || data.length === 0) {
                    throw new Error("Delete blocked by Database Security. Please run the SQL command provided to unlock DELETE permissions.");
                }
                
                alert("Question permanently deleted from Main Bank.");
                document.getElementById('editor-canvas').style.display = 'none';
                document.getElementById('search-id').value = '';
                document.getElementById('search-status').innerText = '';
                activeEditorQuestion = null;
                loadGlobalStats(); 
            } catch (err) { alert("Delete Error: " + err.message); } 
            finally { btn.innerHTML = `<svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width:18px;"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg> Delete Permanently`; btn.disabled = false; }
        }
    </script>
