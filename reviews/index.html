<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wall of Love | BRYT CBT SIM</title>
    
    <link rel="icon" type="image/svg+xml" href="../static/img/brytcbtsim-logo.svg">
    <link rel="icon" type="image/png" sizes="512x512" href="../static/img/brytcbtsim-logo.png">
    <link rel="icon" type="image/png" sizes="192x192" href="../static/img/brytcbtsim-logo1.png">
    <link rel="apple-touch-icon" href="../static/img/apple-touch-icon.png">
    <link rel="icon" href="../favicon.ico" type="image/x-icon">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/main.css">

    <style>
        /* 🚀 STRICT RESPONSIVE BASE */
        html, body { max-width: 100vw; overflow-x: hidden; margin: 0; padding: 0; }
        *, *::before, *::after { box-sizing: border-box; }

        body { 
            background-color: #F5F8FC;
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 30px 30px;
            color: #0B1220; font-family: 'Sora', sans-serif; 
            min-height: 100vh;
        }

        .nav-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1.2rem 5%; background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px); border-bottom: 1px solid #e2e8f0;
            position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 20px rgba(0,0,0,0.02);
        }

        .nav-logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.1rem; color: #071A3A; letter-spacing: -0.5px;}
        .nav-logo img { width: 32px; height: 32px; border-radius: 8px; box-shadow: 0 4px 10px rgba(29, 94, 208, 0.2);}

        .btn-back {
            background: #1D5ED0; color: white; border: none;
            padding: 0.6rem 1.2rem; border-radius: 10px; font-weight: 700; cursor: pointer;
            transition: all 0.2s; font-family: 'Sora', sans-serif; font-size: 0.9rem;
            display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 10px rgba(29, 94, 208, 0.2);
        }
        .btn-back:hover { background: #159FE3; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(21, 159, 227, 0.3); }

        .main-container { max-width: 1200px; margin: 0 auto; padding: 4rem 1.5rem; text-align: center; }

        .hero-title { font-size: 2.8rem; font-weight: 800; margin: 0 0 10px 0; letter-spacing: -1px; color: #071A3A; }
        .hero-subtitle { color: #64748b; font-size: 1.1rem; font-weight: 500; margin: 0 0 3.5rem 0; line-height: 1.6; }

        /* 🚀 IMPROVED MASONRY GRID (Fixes the cut-off issue) */
        .reviews-grid {
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 25px;
            align-items: start; animation: fadeSlideUp 0.6s ease forwards;
        }

        /* 🚀 BEAUTIFUL NEW CARD DESIGN */
        .review-card {
            background: white; border-radius: 20px; padding: 2rem; color: #0B1220; text-align: left;
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.06); border: 1px solid #e2e8f0;
            transition: transform 0.3s ease, box-shadow 0.3s ease; position: relative;
            display: flex; flex-direction: column; overflow: hidden;
            word-wrap: break-word; overflow-wrap: break-word;
        }
        .review-card:hover { transform: translateY(-5px); box-shadow: 0 20px 40px -10px rgba(0,0,0,0.12); border-color: #cbd5e1;}
        
        /* Subtle quote background icon */
        .review-card::before {
            content: '"'; position: absolute; top: 10px; right: 20px; font-size: 8rem; 
            font-family: serif; color: #F5F8FC; font-weight: 900; line-height: 1; z-index: 0;
            user-select: none; pointer-events: none;
        }

        .card-header { display: flex; flex-direction: column; gap: 15px; margin-bottom: 1.2rem; position: relative; z-index: 1;}
        
        .student-info { display: flex; align-items: center; gap: 12px; }
        .avatar-circle {
            width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #1D5ED0, #159FE3);
            color: white; display: flex; justify-content: center; align-items: center;
            font-weight: 700; font-size: 1.1rem; flex-shrink: 0; box-shadow: 0 4px 10px rgba(29, 94, 208, 0.2);
        }
        .s-name { font-weight: 700; font-size: 1.1rem; margin: 0 0 2px 0; color: #0B1220; letter-spacing: -0.5px;}
        .s-course { font-size: 0.75rem; color: #64748b; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;}

        /* 🚀 NEW BADGES ROW */
        .badges-row { display: flex; flex-wrap: wrap; gap: 8px; }
        
        .score-pill {
            background: #f0fdf4; border: 1px solid #bbf7d0; color: #16a34a; padding: 4px 10px;
            border-radius: 8px; font-weight: 700; font-size: 0.8rem; display: inline-flex; align-items: center; gap: 4px;
        }
        
        .exams-pill {
            background: #F5F8FC; border: 1px solid #bfdbfe; color: #1D5ED0; padding: 4px 10px;
            border-radius: 8px; font-weight: 700; font-size: 0.8rem; display: inline-flex; align-items: center; gap: 4px;
        }

        .star-row { display: flex; gap: 3px; color: #fbbf24; margin-bottom: 1rem; position: relative; z-index: 1;}
        .star-row svg { width: 18px; height: 18px; fill: currentColor; }

        .r-text { font-size: 0.95rem; color: #334155; line-height: 1.7; font-weight: 500; margin: 0; position: relative; z-index: 1; flex-grow: 1;}

        @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* 🚀 STRICT MOBILE FIXES */
        @media (max-width: 650px) {
            .nav-header { padding: 1rem; }
            .main-container { padding: 2.5rem 1rem; }
            .hero-title { font-size: 2.2rem; }
            .reviews-grid { grid-template-columns: 1fr; gap: 15px;}
            .review-card { padding: 1.5rem; border-radius: 16px; }
            .s-name { font-size: 1rem; }
            .r-text { font-size: 0.9rem; }
            .avatar-circle { width: 42px; height: 42px; font-size: 1rem;}
        }
    </style>
</head>
<body>

    <nav class="nav-header">
        <div class="nav-logo">
            <img src="../static/img/brytcbtsim-logo.png" alt="BRYT CBT SIM Logo">
            BRYT CBT SIM
        </div>
        <button onclick="window.location.href='../dashboard/index.html'" class="btn-back">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
            Dashboard
        </button>
    </nav>

    <div class="main-container">
        
        <h1 class="hero-title">Wall of Love</h1>
        <p class="hero-subtitle">See what successful students have to say about the CBT Simulator.</p>

        <div id="loading-spinner" style="padding: 4rem 0;">
            <svg class="animate-spin" style="width: 45px; height: 45px; color: #1D5ED0; margin: 0 auto 15px auto; display: block;" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <h3 style="color: #64748b; font-weight: 600;">Loading reviews...</h3>
        </div>

        <div id="reviews-container" class="reviews-grid" style="display: none;">
            <!-- Reviews injected here -->
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../static/app.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            if (typeof supabaseClient === 'undefined') {
                const supabaseUrl = 'PASTE_YOUR_SUPABASE_URL_HERE';
                const supabaseKey = 'PASTE_YOUR_SUPABASE_ANON_KEY_HERE';
                window.supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
            }

            try {
                let finalData = [];
                
                // 🚀 PRIMARY METHOD: Try calling the new RPC function to get Exam Counts
                const { data: rpcData, error: rpcError } = await supabaseClient.rpc('get_public_reviews');
                
                if (!rpcError && rpcData) {
                    finalData = rpcData;
                } else {
                    // 🚀 FAILSAFE: If the SQL function hasn't been added to Supabase yet, fallback to direct table query seamlessly
                    console.warn("RPC not found, falling back to direct table query.");
                    const { data: tableData, error: tableError } = await supabaseClient
                        .from('platform_reviews')
                        .select('*')
                        .order('submitted_at', { ascending: false });
                        
                    if (tableError) throw tableError;
                    finalData = tableData;
                }

                const container = document.getElementById('reviews-container');
                const loader = document.getElementById('loading-spinner');

                if (!finalData || finalData.length === 0) {
                    loader.innerHTML = `
                        <h2 style="color: #071A3A; margin-bottom: 5px;">No reviews yet.</h2>
                        <p style="color: #64748b;">Be the first to share your success story!</p>
                    `;
                    return;
                }

                loader.style.display = 'none';
                container.style.display = 'grid';

                let html = "";
                finalData.forEach((review) => {
                    const initials = review.full_name.trim().split(/\s+/).map(n => n[0]).join('').substring(0, 2).toUpperCase();
                    
                    let stars = "";
                    for(let i=0; i<5; i++) {
                        if (i < review.rating) {
                            stars += `<svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`;
                        } else {
                            stars += `<svg viewBox="0 0 24 24" style="color: #e2e8f0;"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`;
                        }
                    }

                    // Score Pill
                    let badgesHtml = "";
                    if (review.putme_score) {
                        badgesHtml += `
                            <div class="score-pill">
                                <svg style="width:14px; height:14px;" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                Score: ${review.putme_score}
                            </div>
                        `;
                    }
                    
                    // Exams Taken Pill (Only shows if > 0 and exists)
                    if (review.exams_taken && review.exams_taken > 0) {
                        badgesHtml += `
                            <div class="exams-pill">
                                <svg style="width:14px; height:14px;" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                                ${review.exams_taken} Exam${review.exams_taken > 1 ? 's' : ''} Taken
                            </div>
                        `;
                    }

                    // Wrap badges if any exist
                    const finalBadgesHtml = badgesHtml !== "" ? `<div class="badges-row">${badgesHtml}</div>` : '';

                    html += `
                        <div class="review-card">
                            <div class="card-header">
                                <div class="student-info">
                                    <div class="avatar-circle">${initials}</div>
                                    <div style="min-width: 0;">
                                        <p class="s-name">${review.full_name}</p>
                                        <p class="s-course">${review.course}</p>
                                    </div>
                                </div>
                                ${finalBadgesHtml}
                            </div>
                            <div class="star-row">${stars}</div>
                            <p class="r-text">${review.review_text.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</p>
                        </div>
                    `;
                });

                container.innerHTML = html;

            } catch (err) {
                console.error("Error fetching reviews:", err);
                document.getElementById('loading-spinner').innerHTML = `<h3 style="color: #ef4444;">Failed to load reviews. Please try again.</h3>`;
            }
        });
    </script>
</body>
</html>
