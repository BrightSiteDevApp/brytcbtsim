<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | BRYT CBT SIM</title>
    
    <link rel="icon" type="image/svg+xml" href="/static/img/brytcbtsim-logo.svg">
    <link rel="icon" type="image/png" sizes="512x512" href="/static/img/brytcbtsim-logo.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/img/brytcbtsim-logo1.png">
    <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #F5F8FC;
            color: #0B1220;
            font-family: 'Sora', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        
        .error-container {
            background: white;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05);
            max-width: 500px;
            width: 90%;
            border: 1px solid #e2e8f0;
        }
        
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
        }
        
        .logo img {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            box-shadow: 0 4px 12px rgba(29, 94, 208, 0.4);
        }

        h1 {
            font-size: 6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #071A3A 0%, #1D5ED0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            line-height: 1;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-top: 10px;
            color: #0B1220;
            letter-spacing: -0.5px;
        }

        p {
            color: #64748b;
            font-size: 1rem;
            margin-bottom: 2rem;
            line-height: 1.6;
            font-weight: 500;
        }

        .countdown-badge {
            display: inline-block;
            background: #F5F8FC;
            color: #1D5ED0;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 2rem;
            border: 1px solid #bfdbfe;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: #1D5ED0;
            color: white;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s ease;
            border: none;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            box-shadow: 0 4px 10px rgba(29, 94, 208, 0.2);
            font-family: 'Sora', sans-serif;
        }

        .btn:hover {
            transform: translateY(-2px);
            background-color: #159FE3;
            box-shadow: 0 10px 20px rgba(29, 94, 208, 0.3);
        }
    </style>
</head>
<body>

    <div class="error-container">
        <div class="logo">
            <!-- 🚀 REPLACED SVG WITH BRYT PNG -->
            <img src="/static/img/brytcbtsim-logo.png" alt="BRYT CBT SIM Logo">
            <span style="font-weight: 800; color: #0B1220; margin-left: 12px; font-size: 1.2rem; letter-spacing: -0.5px;">BRYT CBT SIM</span>
        </div>
        
        <h1>404</h1>
        <h2>Oops! You seem to be lost.</h2>
        <p>The page you are looking for does not exist, has been moved, or you entered an incorrect URL.</p>
        
        <div class="countdown-badge">
            Redirecting to Dashboard in <span id="timer">5</span>s...
        </div>

        <button onclick="routeToDashboard()" class="btn">
            <svg style="width: 20px;" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            Go to Dashboard Now
        </button>
    </div>

    <script>
        let timeLeft = 5;
        const timerElement = document.getElementById('timer');
        
        function routeToDashboard() {
            // Absolute path ensures it always finds the dashboard regardless of where the 404 happened
            window.location.href = '/dashboard/index.html'; 
        }

        const countdown = setInterval(() => {
            timeLeft--;
            timerElement.innerText = timeLeft;
            
            if (timeLeft <= 0) {
                clearInterval(countdown);
                routeToDashboard();
            }
        }, 1000);
    </script>
</body>
</html>
