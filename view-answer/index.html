    <script>
        window.MathJax = {

    <style>
        /* 🚀 STRICT BRAND SYSTEM & BOX SIZING */
        :root {
            --primary-blue: #1D5ED0;
            --accent-blue: #159FE3;
            --deep-navy: #071A3A;
            --near-black: #0B1220;
            --pure-white: #FFFFFF;
            --light-bg: #F5F8FC;
            --text-gray: #64748B;
            --border-color: #E2E8F0;
        }

        html, body { max-width: 100vw; overflow-x: hidden; margin: 0; padding: 0; }
        *, *::before, *::after { box-sizing: border-box; }

        /* 🚀 HIGH-END CLEAN BACKGROUND */
        body { 
            background-color: var(--light-bg);
            color: var(--near-black); font-family: 'Sora', sans-serif; 
            min-height: 100vh; position: relative;
            background-image: radial-gradient(var(--border-color) 1px, transparent 1px);
            background-size: 30px 30px;
            -webkit-font-smoothing: antialiased;
        }
        
        .nav-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1rem 5%; background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px); border-bottom: 1px solid var(--border-color);
            position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 10px rgba(7, 26, 58, 0.02);
        }

        .nav-logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.1rem; color: var(--deep-navy); letter-spacing: -0.5px;}
        .nav-logo img { width: 32px; height: 32px; border-radius: 8px; box-shadow: 0 4px 10px rgba(29, 94, 208, 0.15); }

        .btn-back {
            background: var(--primary-blue); color: var(--pure-white); border: none;
            padding: 0.6rem 1.2rem; border-radius: 10px; font-weight: 700; cursor: pointer;
            transition: all 0.2s; font-family: 'Sora', sans-serif; font-size: 0.9rem;
            box-shadow: 0 4px 10px rgba(29, 94, 208, 0.2); display: flex; align-items: center; gap: 8px;
        }
        .btn-back:hover { background: var(--accent-blue); transform: translateY(-1px); box-shadow: 0 6px 15px rgba(21, 159, 227, 0.3); }
        .btn-back svg { width: 16px; height: 16px; }

        .review-container { max-width: 850px; margin: 3rem auto; padding: 0 1.5rem; display: flex; flex-direction: column; gap: 2rem; position: relative; z-index: 1; }
        
        /* 🚀 PREMIUM QUESTION CARDS */
        .question-card {
            background: var(--pure-white); padding: 2.5rem; border-radius: 20px; border: 1px solid var(--border-color); 
            box-shadow: 0 4px 15px rgba(7, 26, 58, 0.02); transition: transform 0.3s ease, box-shadow 0.3s ease;
            opacity: 0; transform: translateY(20px);
        }
        .question-card:hover { transform: translateY(-3px); box-shadow: 0 12px 25px rgba(7, 26, 58, 0.05); border-color: #CBD5E1; }

        @keyframes fadeSlideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .q-meta { 
            color: var(--text-gray); font-weight: 800; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px;
            margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 2px solid var(--border-color); padding-bottom: 1rem; 
        }
        
        .q-subject-badge { display: flex; align-items: center; gap: 8px; color: var(--primary-blue); }
        .q-subject-badge svg { width: 18px; height: 18px; }

        .q-text { font-size: 1.15rem; line-height: 1.7; font-weight: 500; margin-bottom: 1.5rem; color: var(--near-black); }

        /* 🚀 SLEEK OPTIONS */
        .option-box { 
            display: flex; align-items: center; padding: 1rem 1.25rem; background: var(--light-bg); 
            border: 1px solid var(--border-color); border-radius: 12px; margin-bottom: 12px; transition: all 0.2s;
        }
        
        .opt-letter { 
            width: 32px; height: 32px; border-radius: 8px; background: var(--pure-white); flex-shrink: 0; 
            display: flex; justify-content: center; align-items: center; font-weight: 700; 
            margin-right: 12px; color: var(--text-gray); transition: all 0.2s; border: 1px solid var(--border-color);
        }
        .opt-text { font-size: 0.95rem; color: var(--near-black); font-weight: 500;}

        /* ✨ HIGHLIGHT STYLES ✨ */
        .option-box.correct { background: #ECFDF5; border-color: #10B981; }
        .option-box.correct .opt-letter { background: #10B981; color: white; border-color: #10B981; box-shadow: 0 2px 8px rgba(16, 185, 129, 0.2); }
        .option-box.correct .opt-text { color: #065F46; font-weight: 600; }
        
        .option-box.wrong { background: #FEF2F2; border-color: #EF4444; }
        .option-box.wrong .opt-letter { background: #EF4444; color: white; border-color: #EF4444; box-shadow: 0 2px 8px rgba(239, 68, 68, 0.2); }
        .option-box.wrong .opt-text { color: #991B1B; font-weight: 600; }

        /* STATUS BADGES */
        .status-badge { padding: 0.4rem 0.8rem; border-radius: 8px; font-size: 0.75rem; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; letter-spacing: 0.5px;}
        .status-badge svg { width: 14px; height: 14px; }
        .badge-correct { background: #DCFCE7; color: #16A34A; border: 1px solid #BBF7D0;}
        .badge-wrong { background: #FEF2F2; color: #DC2626; border: 1px solid #FECACA;}
        .badge-unanswered { background: var(--light-bg); color: var(--text-gray); border: 1px solid var(--border-color);}

        /* 🚀 MODERN REPORT BAR */
        .report-bar {
            display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
            background: var(--light-bg); border: 1px solid var(--border-color); padding: 12px 16px; border-radius: 12px; margin-bottom: 1.5rem;
        }
        .report-id { display: flex; align-items: center; gap: 8px; color: var(--text-gray); font-size: 0.8rem; font-weight: 700; }
        .report-id svg { width: 16px; height: 16px; color: #94A3B8; }
        
        .wa-report-btn {
            display: inline-flex; align-items: center; gap: 6px; background: var(--pure-white); color: #10B981; 
            border: 1px solid #A7F3D0; padding: 6px 12px; border-radius: 8px; text-decoration: none; 
            font-size: 0.8rem; font-weight: 700; transition: all 0.2s; font-family: 'Sora', sans-serif;
        }
        .wa-report-btn:hover { background: #ECFDF5; border-color: #6EE7B7; transform: translateY(-1px); }
        .wa-report-btn svg { width: 14px; height: 14px; }

        /* 🚀 STRICT MOBILE FIXES (Zooming Solved) */
        @media (max-width: 1024px) {
            html, body { font-size: 13px !important; }
            
            .nav-header { padding: 1rem; }
            .nav-logo { font-size: 1rem; }
            .nav-logo img { width: 26px; height: 26px; }
            .btn-back { padding: 0.5rem 0.8rem; font-size: 0.85rem; border-radius: 8px;}
            
            .review-container { margin: 1.5rem auto; padding: 0 1rem; gap: 1.25rem; }
            .question-card { padding: 1.5rem 1.25rem; border-radius: 16px; }
            
            .q-meta { flex-direction: column; align-items: flex-start; gap: 12px; padding-bottom: 0.8rem;}
            .q-text { font-size: 1.1rem; margin-bottom: 1.2rem;}
            
            .report-bar { flex-direction: column; align-items: flex-start; padding: 12px; gap: 12px;}
            .wa-report-btn { width: 100%; justify-content: center; }

            .option-box { padding: 0.85rem 1rem; border-radius: 10px;}
            .opt-letter { width: 30px; height: 30px; font-size: 0.9rem; margin-right: 12px;}
            .opt-text { font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <nav class="nav-header">
        <div class="nav-logo">
            <img src="../static/img/brytcbtsim-logo.png" alt="BRYT CBT SIM Logo">
            BRYT CBT SIM
        </div>
        <button onclick="window.location.href='../result/index.html'" class="btn-back">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
            Back to Result
        </button>
    </nav>

    <div class="review-container" id="review-canvas">
        <div style="text-align: center; margin-top: 4rem; color: var(--text-gray);">
            <svg class="animate-spin" style="width: 36px; height: 36px; color: var(--primary-blue); margin: 0 auto 12px auto; display: block;" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <h3 style="font-size: 1rem; font-weight: 600; margin: 0;">Decrypting Paper Details...</h3>
        </div>
    </div>

    <script>
        const MOJIBAKE_MAP = {
            "a\u0161": "\\sqrt{", "â€²â€²": "-", "âr′": "-", "\\l_s": "\\theta", "\\l,": "\\theta", "i\\in": "\\pi", "Î\\_s": "\\theta",
            "kgmal": "kgm^{-3}", "Nma 2": "Nm^{-2}", "msâˆ’1": "ms^{-1}", "msâˆ’2": "ms^{-2}",
            "â€™": "'", "â€˜": "'", "â€œ": '"', "â€": '"', "â€": '"', "â€š": "‚", "â€ž": "„", "â€“": "-", "â€”": "-", "â€¦": "...", "â€¢": "•",
            "â‚¬": "€", "Â£": "£", "â‚¦": "₦", "âˆ’": "−", "â‰¡": "≡", "â‰ˆ": "≈", "âˆ¼": "∼", "âˆ": "∝", "âˆ«": "∫", "âˆ‘": "∑", "âˆЏ": "∏", "âˆ†": "Δ", "âˆ‡": "∇",
            "âˆˆ": "∈", "âˆ‰": "∉", "âˆ©": "∩", "âˆª": "∪", "âˆ´": "∴", "âˆµ": "∵", "âˆ—": "∗", "âˆ˜": "∘", "âŠ‚": "⊂", "âŠƒ": "⊃", "âŠ†": "⊆", "âŠ‡": "⊇",
            "âŠ•": "⊕", "âŠ—": "⊗", "âŠ¥": "⊥", "â‹…": "⋅", "Ã—": "×", "Ã·": "÷", "Â°": "°", "Â±": "±", "â‰ ": "≠", "â‰¤": "≤", "â‰¥": "≥", "âˆž": "∞", "âˆš": "√",
            "Â²": "^2", "Â³": "^3", "Â¹": "^1", "Â¼": "¼", "Â½": "½", "Â¾": "¾", "â†’": "→", "â‡Œ": "⇌", "â†": "←", "â†‘": "↑", "â†“": "↓", "â†”": "↔",
            "â‡’": "⇒", "â‡": "⇐", "â‡‘": "⇑", "â‡“": "⇓", "â‡”": "⇔",
            "Î±": "α", "Î²": "β", "Î³": "γ", "Î´": "δ", "Îµ": "ε", "Î¶": "ζ", "Î·": "η", "Î¸": "θ", "Î¹": "ι", "Îº": "κ", "Î»": "λ", "Î¼": "μ", "Âµ": "μ",
            "Î½": "ν", "Î¾": "ξ", "Î¿": "ο", "Ï€": "π", "Ï": "ρ", "Ï‚": "ς", "Ïƒ": "σ", "Ï„": "τ", "Ï…": "υ", "Ï†": "φ", "Ï‡": "χ", "Ïˆ": "ψ", "Ï‰": "ω", "Â": " " 
        };
        const MOJIBAKE_KEYS = Object.keys(MOJIBAKE_MAP).sort((a, b) => b.length - a.length);

        function prepText(txt) {
            if (!txt) return "";
            let c = txt;
            for (let i = 0; i < MOJIBAKE_KEYS.length; i++) {
                c = c.split(MOJIBAKE_KEYS[i]).join(MOJIBAKE_MAP[MOJIBAKE_KEYS[i]]);
            }
            const mathCommands = ['\\frac', '\\theta', '\\pi', '\\sqrt', '\\alpha', '\\beta', '\\int', '\\sum', '\\sin', '\\cos', '\\tan', '^'];
            const hasMath = mathCommands.some(cmd => c.includes(cmd));
            const hasDelimiters = c.includes('$') || c.includes('\\(') || c.includes('\\[');
            if (hasMath && !hasDelimiters) c = '\\(' + c + '\\)';
            return c;
        }

        document.addEventListener("DOMContentLoaded", () => {
            const examDataStr = localStorage.getItem('cbt_recent_exam');
            if (!examDataStr) {
                alert("No recent exam data found. Redirecting to dashboard.");
                window.location.href = '../dashboard/index.html';
                return;
            }

            const examData = JSON.parse(examDataStr);
            const questions = examData.questions || [];
            const userAnswers = examData.userAnswers || {};
            const canvas = document.getElementById('review-canvas');
            
            canvas.innerHTML = ''; // Clear loading text

            let htmlString = "";

            questions.forEach((q, index) => {
                const userAns = (userAnswers[index] || "").toUpperCase().trim();
                const actualAns = (q.correct_answer || q.answer || "").toUpperCase().trim();
                const shortId = q.short_id || q.id || 'N/A';
                
                let statusHtml = '';
                if (!userAns) {
                    statusHtml = `<span class="status-badge badge-unanswered"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M18 12H6" /></svg> Unanswered</span>`;
                } else if (userAns === actualAns) {
                    statusHtml = `<span class="status-badge badge-correct"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" /></svg> Correct</span>`;
                } else {
                    statusHtml = `<span class="status-badge badge-wrong"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg> Incorrect</span>`;
                }

                // Determine option classes
                const getClass = (letter) => {
                    if (letter === actualAns) return 'correct';
                    if (letter === userAns && userAns !== actualAns) return 'wrong';
                    return '';
                };

                // Animation delay cascade
                const delay = index * 0.05;

                htmlString += `
                    <div class="question-card" style="animation: fadeSlideUp 0.5s ${delay}s ease forwards;">
                        <div class="q-meta">
                            <div class="q-subject-badge">
                                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                                ${(q.subject || "Subject").toUpperCase()} • Q${index + 1}
                            </div>
                            ${statusHtml}
                        </div>
                        
                        <div class="q-text">
                            ${prepText(q.question_text)}
                        </div>

                        <div class="report-bar">
                            <div class="report-id">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" /></svg>
                                Database ID: ${shortId}
                            </div>
                            <a href="https://wa.me/2347040768581?text=Hello%20admin,%20I%20think%20there%20is%20an%20issue%20with%20this%20question.%20Report%20ID:%20${shortId}%20on%20BRYT%20CBT%20SIM" target="_blank" class="wa-report-btn">
                                <svg fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg>
                                Report Error
                            </a>
                        </div>
                        
                        <div class="option-box ${getClass('A')}">
                            <div class="opt-letter">A</div> <span class="opt-text">${prepText(q.option_a)}</span>
                        </div>
                        <div class="option-box ${getClass('B')}">
                            <div class="opt-letter">B</div> <span class="opt-text">${prepText(q.option_b)}</span>
                        </div>
                        <div class="option-box ${getClass('C')}">
                            <div class="opt-letter">C</div> <span class="opt-text">${prepText(q.option_c)}</span>
                        </div>
                        <div class="option-box ${getClass('D')}">
                            <div class="opt-letter">D</div> <span class="opt-text">${prepText(q.option_d || q.option_D)}</span>
                        </div>
                    </div>
                `;
            });

            canvas.innerHTML = htmlString;

            // Trigger MathJax to render equations
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        });
    </script>
</body>
</html>
