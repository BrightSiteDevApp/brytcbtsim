<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>August 23rd Leaderboard | BRYT CBT SIM</title>
    
    <link rel="icon" type="image/svg+xml" href="../static/img/brytcbtsim-logo.svg">
    <link rel="icon" type="image/png" sizes="512x512" href="../static/img/brytcbtsim-logo.png">
    <link rel="icon" type="image/png" sizes="192x192" href="../static/img/brytcbtsim-logo1.png">
    <link rel="apple-touch-icon" href="../static/img/apple-touch-icon.png">
    <link rel="icon" href="../favicon.ico" type="image/x-icon">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/main.css">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        /* 🚀 STRICT BOX SIZING & BACKGROUND */
        html, body { max-width: 100vw !important; overflow-x: hidden !important; margin: 0; padding: 0; }
        *, *::before, *::after { box-sizing: border-box !important; }

        body { 
            background-color: #F5F8FC;
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 30px 30px;
            color: #0B1220; font-family: 'Sora', sans-serif; 
            min-height: 100vh;
        }

        /* 🚀 GLASSMORPHISM NAV */
        .nav-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1.2rem 5%; background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px); border-bottom: 1px solid #e2e8f0;
            position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 20px rgba(0,0,0,0.02);
        }

        .nav-logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.1rem; color: #071A3A; letter-spacing: -0.5px;}
        .nav-logo img { width: 32px; height: 32px; border-radius: 8px; box-shadow: 0 4px 10px rgba(29, 94, 208, 0.2);}

        .btn-back {
            background: white; color: #475569; border: 1px solid #e2e8f0;
            padding: 0.6rem 1.2rem; border-radius: 10px; font-weight: 700; cursor: pointer;
            transition: all 0.2s; font-family: 'Sora', sans-serif; font-size: 0.9rem;
            display: flex; align-items: center; gap: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .btn-back:hover { background: #f1f5f9; color: #0B1220; transform: translateY(-2px); }
        .btn-back svg { width: 16px; height: 16px; }

        .leaderboard-container { max-width: 1000px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem 1.5rem; text-align: center; }

        /* 🚀 CINEMATIC HERO HEADER */
        .leaderboard-hero {
            background: linear-gradient(135deg, #071A3A 0%, #1D5ED0 100%);
            border-radius: 24px; padding: 3rem 2rem; margin-bottom: 3.5rem; color: white;
            position: relative; overflow: hidden; box-shadow: 0 20px 40px -15px rgba(7, 26, 58, 0.4);
            animation: fadeSlideUp 0.5s ease forwards;
        }
        .leaderboard-hero::after {
            content: ''; position: absolute; top: -50%; right: -10%; width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(21, 159, 227, 0.15) 0%, transparent 70%); border-radius: 50%; pointer-events: none;
        }

        /* 🚀 EVENT BADGE */
        .bryt-badge { 
            display: inline-flex; align-items: center; gap: 8px; background: rgba(21, 159, 227, 0.1); 
            border: 1px solid rgba(21, 159, 227, 0.3); color: #159FE3; padding: 0.5rem 1.2rem; 
            border-radius: 50px; font-weight: 800; font-size: 0.85rem; margin-bottom: 1.5rem; 
            text-transform: uppercase; letter-spacing: 0.5px; position: relative; z-index: 2;
        }
        .bryt-badge svg { width: 16px; height: 16px; }

        .hero-title { font-size: 2.5rem; font-weight: 800; margin: 0 0 10px 0; letter-spacing: -0.5px; position: relative; z-index: 2; }
        .hero-subtitle { color: #E0E7FF; font-size: 1.05rem; font-weight: 500; margin: 0; position: relative; z-index: 2;}

        /* 🚀 PLUSH PODIUM */
        .podium-wrapper { 
            display: flex; justify-content: center; align-items: flex-end; 
            gap: 20px; margin: 0 auto 4rem auto; min-height: 280px; max-width: 700px;
            animation: fadeSlideUp 0.6s ease forwards; animation-delay: 0.1s; opacity: 0;
        }
        
        .podium-step {
            background: white; color: #0B1220; border-radius: 20px 20px 16px 16px;
            width: 200px; padding: 2rem 1.2rem 1.5rem 1.2rem; position: relative;
            box-shadow: 0 15px 35px -10px rgba(0,0,0,0.1); border: 1px solid #e2e8f0;
            display: flex; flex-direction: column; justify-content: flex-start;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .podium-step:hover { transform: translateY(-8px); box-shadow: 0 25px 50px -12px rgba(0,0,0,0.15); border-color: #cbd5e1;}
        
        .step-1 { height: 260px; z-index: 3; order: 2; border-top: 6px solid #fbbf24; }
        .step-2 { height: 220px; z-index: 2; order: 1; border-top: 6px solid #94a3b8; }
        .step-3 { height: 190px; z-index: 1; order: 3; border-top: 6px solid #d97706; }

        .p-rank {
            position: absolute; top: -24px; left: 50%; transform: translateX(-50%);
            width: 48px; height: 48px; border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-weight: 900; font-size: 1.2rem; color: white; box-shadow: 0 8px 16px rgba(0,0,0,0.15); border: 2px solid white;
        }
        .step-1 .p-rank { background: linear-gradient(135deg, #fcd34d 0%, #d97706 100%); width: 56px; height: 56px; top: -28px; font-size: 1.5rem;}
        .step-2 .p-rank { background: linear-gradient(135deg, #e2e8f0 0%, #64748b 100%); }
        .step-3 .p-rank { background: linear-gradient(135deg, #fdba74 0%, #b45309 100%); }

        .p-name { font-weight: 800; font-size: 1.1rem; margin-top: 24px; line-height: 1.2; word-break: break-word; color: #0B1220; letter-spacing: -0.5px;}
        .step-1 .p-name { font-size: 1.25rem; margin-top: 30px; }
        .p-course { font-size: 0.75rem; color: #64748b; font-weight: 700; margin-top: 6px; text-transform: uppercase; line-height: 1.3; }
        .p-score { font-size: 1.8rem; font-weight: 900; color: #1D5ED0; margin-top: auto; padding-top: 10px; line-height: 1;}
        .p-putme { font-size: 0.75rem; color: #64748b; font-weight: 700; margin-top: 4px; }

        /* 🚀 DATA TABLE CARD */
        .table-card {
            background: white; border-radius: 24px; overflow: hidden;
            box-shadow: 0 15px 40px -10px rgba(0,0,0,0.05); border: 1px solid #e2e8f0;
            animation: fadeSlideUp 0.6s ease forwards; animation-delay: 0.2s; opacity: 0;
        }

        .table-wrap { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .rank-table { width: 100%; border-collapse: collapse; text-align: left; min-width: 450px; margin: 0;}
        .rank-table th { 
            background: #F5F8FC; color: #475569; font-weight: 800; text-transform: uppercase; 
            font-size: 0.8rem; padding: 1.2rem 1.5rem; border-bottom: 2px solid #e2e8f0; white-space: nowrap; letter-spacing: 0.5px;
        }
        .rank-table td { padding: 1.2rem 1.5rem; border-bottom: 1px solid #f1f5f9; color: #0B1220; font-size: 0.95rem; font-weight: 600; vertical-align: middle; white-space: nowrap; }
        .rank-table tr:hover td { background: #F5F8FC; }
        
        .rank-badge { background: #f1f5f9; color: #64748b; padding: 6px 12px; border-radius: 8px; font-weight: 800; font-size: 0.85rem; display: inline-block; border: 1px solid #e2e8f0;}
        .score-highlight { color: #1D5ED0; font-weight: 900; font-size: 1.15rem; background: #F5F8FC; padding: 6px 12px; border-radius: 8px;}

        .empty-state { padding: 4rem 1.5rem; text-align: center; color: #64748b; }
        #loading-spinner { display: flex; flex-direction: column; align-items: center; padding: 4rem 0; color: #0B1220; }

        @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        /* 🚀 MOBILE RESPONSIVENESS */
        @media (max-width: 650px) {
            .nav-header { padding: 1rem; }
            .leaderboard-hero { padding: 2.5rem 1.5rem; margin-bottom: 2.5rem; border-radius: 20px;}
            .hero-title { font-size: 1.8rem; }
            .hero-subtitle { font-size: 0.9rem; }
            .leaderboard-container { padding: 1.5rem 1rem 3rem 1rem; }

            .podium-wrapper { flex-direction: column; align-items: center; gap: 15px; min-height: auto; margin-bottom: 2.5rem; width: 100%; }
            .podium-step { 
                width: 100%; max-width: 100%; height: auto !important; padding: 1.2rem 1.5rem; 
                border-top: none; border-left: 8px solid; border-radius: 16px; 
                flex-direction: row; align-items: center; text-align: left; order: initial !important; 
            }
            .step-1 { border-left-color: #fbbf24; }
            .step-2 { border-left-color: #94a3b8; }
            .step-3 { border-left-color: #d97706; }

            .p-rank { position: static; transform: none; width: 40px !important; height: 40px !important; font-size: 1rem !important; margin-right: 15px; flex-shrink: 0; box-shadow: none; border: none;}
            .podium-step-info { flex-grow: 1; min-width: 0; }
            .p-name { margin-top: 0 !important; font-size: 1.05rem !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
            .p-course { margin-top: 4px; font-size: 0.7rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
            .p-score-box { text-align: right; flex-shrink: 0; margin-left: 10px; }
            .p-score { margin-top: 0; font-size: 1.4rem; padding-top: 0; }
            .p-putme { font-size: 0.7rem; margin-top: 2px;}

            .table-card { border-radius: 16px; }
            .rank-table th { padding: 1rem; font-size: 0.75rem; }
            .rank-table td { padding: 1rem; font-size: 0.85rem; }
            .hide-mobile { display: none; }
        }
    </style>
</head>
<body>

    <nav class="nav-header">
        <div class="nav-logo">
            <img src="../static/img/brytcbtsim-logo.png" alt="BRYT CBT SIM Logo">
            BRYT CBT SIM
        </div>
        <button onclick="window.history.back()" class="btn-back">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
            Go Back
        </button>
    </nav>

    <div class="leaderboard-container">
        
        <div class="leaderboard-hero">
            <div class="bryt-badge">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                Kaduna Post-UTME: Aug 24, 2026
            </div>
            <h1 class="hero-title">Official Leaderboard</h1>
            <p class="hero-subtitle">August 23rd Mock Examination Rankings</p>
        </div>

        <div id="loading-spinner">
            <svg class="animate-spin" style="width: 45px; height: 45px; color: #1D5ED0; margin-bottom: 15px;" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <h3 style="font-weight: 700; margin: 0; color: #0B1220;">Compiling Live Rankings...</h3>
        </div>

        <div id="leaderboard-content" style="display: none;">
            <div class="podium-wrapper" id="podium-container"></div>
            <div class="table-card">
                <div class="table-wrap">
                    <table class="rank-table">
                        <thead>
                            <tr>
                                <th style="width: 60px; text-align: center;">Rank</th>
                                <th>Aspirant Name</th>
                                <th class="hide-mobile">Course</th>
                                <th style="text-align: center;">Post-UTME</th>
                                <th style="text-align: right;">Aggregate</th>
                            </tr>
                        </thead>
                        <tbody id="table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Ensure Supabase loads -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../static/app.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", fetchLeaderboard);

        async function fetchLeaderboard() {
            try {
                // 🚀 ROUTES TO THE 23RD RESULTS TABLE
                const { data, error } = await supabaseClient
                    .from('mock_23_results')
                    .select('full_name, total_score, breakdown')
                    .order('submitted_at', { ascending: true });

                if (error) throw error;

                if (!data || data.length === 0) {
                    document.getElementById('loading-spinner').innerHTML = `
                        <div class="empty-state">
                            <h2 style="color: #0B1220; margin: 0 0 10px 0; font-weight: 800;">Waiting for submissions...</h2>
                            <p style="color: #64748b; margin: 0; font-weight: 500;">No aspirants have submitted the mock exam yet.</p>
                        </div>
                    `;
                    return;
                }

                data.sort((a, b) => {
                    const aggA = a.breakdown?.calculated_aggregate || 0;
                    const aggB = b.breakdown?.calculated_aggregate || 0;
                    if (aggB !== aggA) return aggB - aggA;
                    return (b.total_score || 0) - (a.total_score || 0);
                });

                renderLeaderboard(data);

            } catch (err) {
                console.error("Leaderboard Error:", err);
                document.getElementById('loading-spinner').innerHTML = `
                    <div class="empty-state" style="color: #ef4444;">
                        <svg style="width: 40px; height: 40px; margin-bottom: 15px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                        <h2 style="margin: 0 0 10px 0;">Error loading rankings.</h2>
                        <p style="margin: 0; color: #991b1b;">Please check your connection and refresh.</p>
                    </div>
                `;
            }
        }

        function renderLeaderboard(data) {
            document.getElementById('loading-spinner').style.display = 'none';
            document.getElementById('leaderboard-content').style.display = 'block';

            const top3 = data.slice(0, 3);
            const rest = data.slice(3);

            const podiumContainer = document.getElementById('podium-container');
            let podiumHtml = "";

            if (top3[1]) podiumHtml += createPodiumStep(top3[1], 2, 'step-2');
            if (top3[0]) podiumHtml += createPodiumStep(top3[0], 1, 'step-1');
            if (top3[2]) podiumHtml += createPodiumStep(top3[2], 3, 'step-3');

            podiumContainer.innerHTML = podiumHtml;

            if (top3.length > 0) {
                setTimeout(() => {
                    confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 }, colors: ['#fbbf24', '#cbd5e1', '#d97706', '#1D5ED0'] });
                }, 600);
            }

            const tbody = document.getElementById('table-body');
            if (rest.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#64748b; padding:3rem 1rem; font-weight: 500;">All participating aspirants are currently shown on the podium above.</td></tr>`;
            } else {
                let tableHtml = "";
                rest.forEach((user, index) => {
                    const rank = index + 4;
                    const name = user.full_name || 'Aspirant';
                    const rawCourse = user.breakdown?.course || 'General Assessment';
                    const cleanCourse = rawCourse.replace(/\[.*?\]/g, '').trim();
                    const aggregate = (user.breakdown?.calculated_aggregate || 0).toFixed(1) + '%';
                    const putme = (user.total_score || 0) + '/50';

                    tableHtml += `
                        <tr>
                            <td style="text-align: center;"><span class="rank-badge">#${rank}</span></td>
                            <td style="font-weight: 800; color: #0B1220;">${name}</td>
                            <td class="hide-mobile" style="color: #64748b; font-size: 0.8rem; text-transform: uppercase;">${cleanCourse}</td>
                            <td style="text-align: center; color: #64748b;">${putme}</td>
                            <td style="text-align: right;"><span class="score-highlight">${aggregate}</span></td>
                        </tr>
                    `;
                });
                tbody.innerHTML = tableHtml;
            }
        }

        function createPodiumStep(user, rank, stepClass) {
            const firstName = user.full_name ? user.full_name.trim().split(/\s+/)[0] : 'Aspirant';
            const rawCourse = user.breakdown?.course || 'BRYT Aspirant';
            const cleanCourse = rawCourse.replace(/\[.*?\]/g, '').trim();
            const aggregate = (user.breakdown?.calculated_aggregate || 0).toFixed(1) + '%';
            const putme = (user.total_score || 0) + '/50';

            return `
                <div class="podium-step ${stepClass}">
                    <div class="p-rank">${rank}</div>
                    <div class="podium-step-info">
                        <div class="p-name">${firstName}</div>
                        <div class="p-course">${cleanCourse}</div>
                    </div>
                    <div class="p-score-box">
                        <div class="p-score">${aggregate}</div>
                        <div class="p-putme">P-UTME: ${putme}</div>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
